<!doctype html>
<!-- Minimal template: the DentoSim web app embeds the loader itself; this page is only for standalone testing. -->
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DentoSim Viewer</title>
<style>html,body{margin:0;height:100%;background:#f5f5f4}canvas{width:100%;height:100%;display:block;touch-action:none}</style></head>
<body><canvas id="unity-canvas"></canvas>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>createUnityInstance(document.querySelector("#unity-canvas"), {
  dataUrl: "Build/{{{ DATA_FILENAME }}}", frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}", codeUrl: "Build/{{{ CODE_FILENAME }}}",
  companyName: "{{{ COMPANY_NAME }}}", productName: "{{{ PRODUCT_NAME }}}", productVersion: "{{{ PRODUCT_VERSION }}}"
});</script>
</body></html>
